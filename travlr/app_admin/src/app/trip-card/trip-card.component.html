<div class="card" style="width: 16rem;">
  <div class="card-header">{{ trip.name }}</div>
  <img [src]="'assets/images/' + trip.image" [alt]="trip.name" class="card-img-top">
  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>
    <p class="card-subtitle mb-3 text-muted">
      {{ trip.length }} only {{ trip.perPerson | currency:'USD' }} per person
    </p>
    <div class="card-text" [innerHTML]="trip.description"></div>
  </div>
</div>
